name: Build and release multi-arch container images

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

env:
  PLATFORMS: linux/amd64,linux/arm64
  BUILDCONTEXTS: "" # ugly band-aid as per https://github.com/github/vscode-github-actions/issues/47#issuecomment-1488592302

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get all git tags
        run: |
          git fetch --prune --unshallow --tags --force
          
      - name: Burn in version information
        run: go generate .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log into the container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: metadata # later referenced as "steps.metadata."
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Prepare (fake) Go workspace and build contexts
        shell: bash
        run: |
          mkdir .emptyctx
          NUMCONTEXTS=9
          buildcontexts=""
          for ((ctxno=1;ctxno<=NUMCONTEXTS;ctxno++)); do
            buildcontexts+=$'\n'"bctx${ctxno}=.emptyctx"
          done
          EOF="**ENDOFTHEINTERNET**"
          echo "BUILDCONTEXTS<<$EOF" >> $GITHUB_ENV
          echo "$buildcontexts" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./deployments/lxkns/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            WSDISKPATHS=./lxkns
            REACT_APP_GIT_VERSION=${{ github.ref_name }}
          build-contexts: |
            webappsrc=./web/lxkns
            ${{ env.BUILDCONTEXTS }}
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=Linux
            kernel namespaces discovery

      - name: Publish compose file(s) as OCI artifact(s)
        shell: bash
        run: |
          echo "${{ steps.metadata.outputs.tag-names }}" | while read -r tag; do
            TAG="$tag" docker compose \
              -f deployments/oci-artifact-app/docker-compose.yaml \
              publish --resolve-image-digests \
                ghcr.io/${{ github.repository }}/app:$tag
            TAG="$tag" docker compose \
              -f deployments/oci-artifact-app/docker-compose-cfg.yaml \
              publish --resolve-image-digests \
                ghcr.io/${{ github.repository }}/app/cfg:$tag
          done

      - name: Build Industrial Edge app bundle
        shell: bash
        run: |
          export TAG="${{github.ref_name}}"
          TAG="${TAG#v}"
          go run github.com/thediveo/tiap/cmd/tiap@v0.14.1 \
            deployments/industrial-edge \
            --out lxkns.app \
            --interpolate \
            --app-version "${{github.ref_name}}"
          zip -9 lxkns.zip lxkns.app LICENSE

      - name: Release Industrial Edge app bundle
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            lxkns.zip
