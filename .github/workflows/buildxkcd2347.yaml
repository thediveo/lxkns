name: build xkcd 2347
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:

  build:
    name: Build web UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: test build
        run: |
          corepack enable
          yarn set version latest # has CI envvar already set, so yarn will not be asking back
          yarn install
          yarn build
        working-directory: web/lxkns
